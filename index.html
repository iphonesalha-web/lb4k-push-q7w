<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="LIBANON Push">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0e0b1a">
<meta name="robots" content="noindex, nofollow">
<title>إرسال سيرفر — LIBANON 4K</title>
<style>
  :root { --bg:#0e0b1a; --card:#1a1530; --line:#2d2650; --text:#f1edfb; --muted:#a49cc0;
          --accent:#B14BF4; --ok:#2BE886; --err:#ff6b6b; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
         font-family:-apple-system,"Segoe UI",Tahoma,sans-serif; padding:max(24px, env(safe-area-inset-top)) 16px 24px; }
  .box { max-width:520px; margin:0 auto; background:var(--card); border:1px solid var(--line);
         border-radius:16px; padding:26px; }
  h1 { margin:0 0 4px; font-size:22px; }
  .sub { color:var(--muted); font-size:14px; margin:0 0 22px; }
  label { display:block; font-size:13px; color:var(--muted); margin:14px 0 6px; }
  input { width:100%; background:#0e0b1a; color:var(--text); border:1px solid var(--line);
          border-radius:10px; padding:12px 14px; font-size:16px; direction:ltr; text-align:left; }
  input:focus { outline:none; border-color:var(--accent); }
  #code { font-size:24px; letter-spacing:4px; text-transform:uppercase; text-align:center; font-weight:bold; }
  .presets { display:flex; gap:8px; margin-top:8px; }
  .chip { flex:1; background:transparent; color:var(--text); border:1px solid var(--line);
          border-radius:10px; padding:9px; cursor:pointer; font-size:14px; }
  .chip:hover { border-color:var(--accent); }
  button.main { width:100%; margin-top:22px; background:var(--accent); color:#fff; border:0;
                border-radius:10px; padding:14px; font-size:17px; font-weight:bold; cursor:pointer; }
  button.main:disabled { opacity:.5; cursor:default; }
  .link { background:none; border:0; color:var(--muted); cursor:pointer; font-size:13px;
          margin-top:14px; text-decoration:underline; }
  .msg { margin-top:16px; padding:12px 14px; border-radius:10px; font-size:15px; display:none; }
  .msg.info { display:block; background:#241d42; }
  .msg.ok   { display:block; background:#123528; color:var(--ok); }
  .msg.err  { display:block; background:#3a1820; color:var(--err); }
  .hint { color:var(--muted); font-size:12px; margin-top:6px; }
  .hidden { display:none; }
  .who { color:var(--muted); font-size:12px; display:flex; justify-content:space-between; margin-bottom:16px; }
</style>
</head>
<body>
<div class="box">
  <h1>إرسال سيرفر إلى جهاز</h1>
  <p class="sub">LIBANON 4K — يصل إلى التلفزيون خلال ثوانٍ</p>

  <!-- تسجيل الدخول -->
  <div id="loginView" class="hidden">
    <label>البريد (حساب المدير في Firebase)</label>
    <input id="email" type="email" autocomplete="username">
    <label>كلمة السر</label>
    <input id="pw" type="password" autocomplete="current-password">
    <button class="main" id="loginBtn">دخول</button>
    <div id="loginMsg" class="msg"></div>
  </div>

  <!-- الإرسال -->
  <div id="sendView" class="hidden">
    <div class="who"><span id="whoami"></span><button class="link" id="logoutBtn" style="margin:0">خروج</button></div>

    <label>كود الجهاز (يظهر على التلفزيون في شاشة "أدخل البيانات من هاتفك")</label>
    <input id="code" maxlength="9" placeholder="XXXX-XXXX">

    <label>رابط M3U كامل (اختياري — يملأ الخانات تلقائياً)</label>
    <input id="m3u" placeholder="http://server:port/get.php?username=...&password=...">

    <label>السيرفر</label>
    <input id="url" placeholder="http://server:port">
    <div class="presets">
      <button class="chip" data-url="http://libanon4k.eu">Neo</button>
      <button class="chip" data-url="http://maripor.com">Dino</button>
    </div>

    <label>اسم المستخدم</label>
    <input id="user" autocomplete="off">
    <label>كلمة السر</label>
    <input id="pass" autocomplete="off">

    <button class="main" id="sendBtn">إرسال إلى التلفزيون</button>
    <div id="sendMsg" class="msg"></div>
    <button class="link hidden" id="cancelBtn">إلغاء الإرسال</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, setDoc, deleteDoc, onSnapshot, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSyD7xJQAFp9RydUX-deLotVD54wwQhYMOVM",
  authDomain: "nms-player.firebaseapp.com",
  projectId: "nms-player",
});
const auth = getAuth(app);
const db = getFirestore(app);
const $ = id => document.getElementById(id);
const ALPHABET = /^[ABCDEFGHJKLMNPQRSTUVWXYZ23456789]{8}$/;

function show(el, cls, text) { el.className = "msg " + cls; el.textContent = text; }

onAuthStateChanged(auth, u => {
  $("loginView").classList.toggle("hidden", !!u);
  $("sendView").classList.toggle("hidden", !u);
  if (u) $("whoami").textContent = u.email;
});

$("loginBtn").onclick = async () => {
  show($("loginMsg"), "info", "جارٍ الدخول…");
  try { await signInWithEmailAndPassword(auth, $("email").value.trim(), $("pw").value); }
  catch (e) { show($("loginMsg"), "err", "فشل الدخول: البريد أو كلمة السر غير صحيحة."); }
};
$("logoutBtn").onclick = () => signOut(auth);

// أزرار Neo / Dino
document.querySelectorAll(".chip").forEach(b => b.onclick = () => { $("url").value = b.dataset.url; });

// تفكيك رابط M3U: http://host:port/get.php?username=U&password=P
$("m3u").addEventListener("input", () => {
  try {
    const u = new URL($("m3u").value.trim());
    const user = u.searchParams.get("username"), pass = u.searchParams.get("password");
    if (user && pass) {
      $("url").value = u.protocol + "//" + u.host;
      $("user").value = user; $("pass").value = pass;
    }
  } catch (_) {}
});

let unsub = null, currentCode = null;

$("sendBtn").onclick = async () => {
  const code = $("code").value.toUpperCase().replace(/[\s-]/g, "");
  let url = $("url").value.trim().replace(/\/+$/, "");
  const user = $("user").value.trim(), pass = $("pass").value.trim();
  const msg = $("sendMsg");

  if (!ALPHABET.test(code)) return show(msg, "err", "كود الجهاز غير صحيح — 8 خانات كما تظهر على التلفزيون.");
  if (!url || !user || !pass) return show(msg, "err", "يرجى تعبئة السيرفر واسم المستخدم وكلمة السر.");
  if (!/^https?:\/\//i.test(url)) url = "http://" + url;

  $("sendBtn").disabled = true;
  try {
    await setDoc(doc(db, "push", code), { url, user, pass, createdAt: serverTimestamp() });
  } catch (e) {
    $("sendBtn").disabled = false;
    return show(msg, "err", "تعذّر الإرسال (" + (e.code || e.message) + "). تأكّد من قواعد Firestore.");
  }

  currentCode = code;
  show(msg, "info", "أُرسل ✓ — بانتظار التلفزيون… (يجب أن تكون شاشة \"أدخل البيانات من هاتفك\" مفتوحة عليه)");
  $("cancelBtn").classList.remove("hidden");

  // التطبيق يحذف المستند فور استلامه — اختفاؤه يعني نجاح الاستلام.
  if (unsub) unsub();
  unsub = onSnapshot(doc(db, "push", code), snap => {
    if (!snap.exists()) {
      unsub(); unsub = null; currentCode = null;
      show(msg, "ok", "تم الاستلام على التلفزيون ✓ — الجهاز يسجّل الدخول الآن.");
      $("cancelBtn").classList.add("hidden");
      $("sendBtn").disabled = false;
    }
  });
};

$("cancelBtn").onclick = async () => {
  if (!currentCode) return;
  if (unsub) { unsub(); unsub = null; }
  await deleteDoc(doc(db, "push", currentCode)).catch(() => {});
  currentCode = null;
  show($("sendMsg"), "info", "أُلغي الإرسال.");
  $("cancelBtn").classList.add("hidden");
  $("sendBtn").disabled = false;
};
</script>
</body>
</html>
